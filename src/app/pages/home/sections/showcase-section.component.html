<section class="section showcase">
  <div class="container">
    <app-section-heading
      [eyebrow]="i18n.t('home.showcase.eyebrow')"
      [title]="i18n.t('home.showcase.title')"
      [lede]="i18n.t('home.showcase.lede')"
    />

    <div class="grid">
      <!-- Today mock -->
      <div class="card card--today">
        <div class="card__header">
          <span class="card__label">{{ i18n.t('home.showcase.todayLabel') }}</span>
          <span class="card__pill">21 mai</span>
        </div>
        <div class="ring">
          <svg viewBox="0 0 120 120" width="100%" height="100%">
            <circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,0.06)" stroke-width="10" fill="none"/>
            <circle cx="60" cy="60" r="50" stroke="#6366F1" stroke-width="10" fill="none"
                    stroke-linecap="round" stroke-dasharray="314" stroke-dashoffset="80"
                    transform="rotate(-90 60 60)"/>
            <text x="60" y="58" text-anchor="middle" font-family="Syne" font-weight="800" font-size="20" fill="#F8FAFC">74%</text>
            <text x="60" y="76" text-anchor="middle" font-family="DM Sans" font-size="9" fill="#94A3B8">jour</text>
          </svg>
        </div>
        <div class="bars">
          <span style="height: 50%"></span>
          <span style="height: 70%"></span>
          <span style="height: 40%"></span>
          <span style="height: 90%"></span>
          <span style="height: 60%"></span>
          <span style="height: 85%"></span>
          <span style="height: 100%" class="bars__today"></span>
        </div>
      </div>

      <!-- Stats / heatmap mock -->
      <div class="card card--stats">
        <div class="card__header">
          <span class="card__label">{{ i18n.t('home.showcase.statsLabel') }}</span>
          <span class="card__pill">9 mois</span>
        </div>
        <div class="heatmap">
          @for (col of heatColumns; track $index) {
            <div class="heatmap__col">
              @for (cell of col; track $index) {
                <span class="heatmap__cell" [style.background]="cellColor(cell)"></span>
              }
            </div>
          }
        </div>
        <div class="legend">
          <span>moins</span>
          <span class="legend__cell" style="background: #1E293B"></span>
          <span class="legend__cell" style="background: #064E3B"></span>
          <span class="legend__cell" style="background: #047857"></span>
          <span class="legend__cell" style="background: #10B981"></span>
          <span>plus</span>
        </div>
      </div>

      <!-- Profile mock -->
      <div class="card card--profile">
        <div class="card__header">
          <span class="card__label">{{ i18n.t('home.showcase.profileLabel') }}</span>
          <span class="card__pill">niv. 7</span>
        </div>
        <div class="avatar">S</div>
        <div class="xp">
          <div class="xp__bar"><span style="width: 64%"></span></div>
          <div class="xp__line">
            <span>640 XP</span>
            <span>1000 XP</span>
          </div>
        </div>
        <div class="badges">
          <span class="badge">🔥</span>
          <span class="badge">⚡</span>
          <span class="badge">💎</span>
          <span class="badge badge--locked">👑</span>
          <span class="badge">🌟</span>
          <span class="badge badge--locked">🚀</span>
        </div>
      </div>
    </div>
  </div>
</section>
